<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leen — Inventory</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* ---- palette ---- */
    --pink: #ff3d81;
    --violet: #7c3aed;
    --blue: #3d6bff;
    --cyan: #00c2d1;
    --orange: #ff9142;

    --ink: #1c1730;
    --ink-soft: #6c6480;
    --page: #efe9ff;

    --glass: rgba(255, 255, 255, 0.6);
    --glass-strong: rgba(255, 255, 255, 0.78);
    --glass-border: rgba(255, 255, 255, 0.75);
    --glass-shadow: 0 8px 32px rgba(60, 40, 120, 0.16);

    --radius-lg: 26px;
    --radius-md: 16px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Inter', Arial, sans-serif;
    margin: 0;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    background: var(--page);
    min-height: 100vh;
  }

  h1, h2, h3 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    margin: 0;
    letter-spacing: -0.01em;
  }

  a, button { font-family: inherit; }

  :focus-visible {
    outline: 2px solid var(--violet);
    outline-offset: 2px;
  }

  /* ---------- animated gradient backdrop ---------- */
  .bg-blobs {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    background: #f3efff;
  }
  .bg-blobs .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.55;
  }
  .blob.b1 { width: 520px; height: 520px; top: -160px; left: -120px; background: var(--pink); animation: drift1 26s ease-in-out infinite; }
  .blob.b2 { width: 480px; height: 480px; top: 20%; right: -160px; background: var(--blue); animation: drift2 30s ease-in-out infinite; }
  .blob.b3 { width: 460px; height: 460px; bottom: -180px; left: 18%; background: var(--cyan); animation: drift3 34s ease-in-out infinite; }
  .blob.b4 { width: 380px; height: 380px; bottom: 10%; right: 12%; background: var(--orange); animation: drift1 22s ease-in-out infinite reverse; }

  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(60px,40px) scale(1.08); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-50px,60px) scale(1.05); } }
  @keyframes drift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(40px,-50px) scale(1.1); } }

  @media (prefers-reduced-motion: reduce) {
    .bg-blobs .blob { animation: none; }
  }

  /* ---------- header + nav (glass) ---------- */
  header {
    margin: 22px 22px 0;
    padding: 24px 30px;
    background: var(--glass-strong);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--glass-shadow);
  }
  header .brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 {
    font-size: 30px;
    font-weight: 600;
    background: linear-gradient(100deg, var(--pink), var(--violet) 55%, var(--blue));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header .tagline { font-size: 13.5px; color: var(--ink-soft); font-style: italic; font-family: 'Fraunces', serif; }

  nav {
    display: flex;
    gap: 8px;
    margin: 16px 22px 0;
    padding: 8px;
    background: var(--glass);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    box-shadow: var(--glass-shadow);
    width: fit-content;
  }
  nav button {
    padding: 10px 20px;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
    border-radius: 999px;
    transition: all 0.2s ease;
  }
  nav button:hover { color: var(--ink); background: rgba(255,255,255,0.5); }
  nav button.active {
    color: #fff;
    background: linear-gradient(120deg, var(--pink), var(--violet));
    box-shadow: 0 6px 18px rgba(124, 58, 237, 0.35);
  }

  main {
    max-width: 1120px;
    margin: 0 auto;
    padding: 26px 22px 60px;
  }

  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 22px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .panel-head h2 { font-size: 23px; }
  .count { font-size: 13px; color: var(--ink-soft); font-weight: 500; }

  /* ---------- Collection controls (search + tag filters) ---------- */
  .collection-controls {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 24px;
  }
  .filter-search-row {
    position: relative;
    max-width: 380px;
  }
  .filter-search-row input {
    padding-left: 38px;
    background: rgba(255,255,255,0.7);
  }
  .filter-search-row::before {
    content: '';
    position: absolute;
    left: 13px;
    top: 50%;
    width: 14px;
    height: 14px;
    transform: translateY(-50%);
    border: 2px solid var(--ink-soft);
    border-radius: 50%;
    box-shadow: 5px 5px 0 -3px var(--ink-soft);
    pointer-events: none;
  }
  .tag-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .tag-pill {
    padding: 6px 15px;
    border-radius: 999px;
    border: 1.5px solid rgba(124, 58, 237, 0.22);
    background: rgba(255,255,255,0.5);
    color: var(--ink-soft);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tag-pill:hover { border-color: var(--violet); color: var(--violet); }
  .tag-pill.active {
    background: linear-gradient(120deg, var(--violet), var(--blue));
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 12px rgba(61, 107, 255, 0.3);
  }
  .clear-filters {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 12.5px;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px 2px;
  }
  .clear-filters:hover { color: var(--pink); }

  /* ---------- Gallery grid ---------- */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 26px 20px;
  }
  .piece {
    cursor: pointer;
    border: none;
    background: none;
    text-align: left;
    padding: 0;
  }
  .piece-frame {
    position: relative;
    aspect-ratio: 3 / 4;
    background: var(--glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-md);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
    box-shadow: var(--glass-shadow);
    transition: transform 0.22s ease, box-shadow 0.22s ease;
  }
  .piece:hover .piece-frame {
    transform: translateY(-6px);
    box-shadow: 0 16px 36px rgba(255, 61, 129, 0.28);
  }
  .piece-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .piece-frame .no-image {
    font-size: 12px;
    color: var(--ink-soft);
    font-family: 'Fraunces', serif;
    font-style: italic;
  }
  .price-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(120deg, var(--pink), var(--orange));
    box-shadow: 0 4px 12px rgba(255, 61, 129, 0.35);
  }
  .qty-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink);
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(6px);
  }
  .tag-badge {
    position: absolute;
    bottom: 10px;
    left: 10px;
    right: 10px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(120deg, var(--blue), var(--cyan));
    text-overflow: ellipsis;
    white-space: nowrap;
    overflow: hidden;
    text-align: center;
  }
  .piece-name {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    line-height: 1.3;
    margin-bottom: 2px;
  }
  .piece-id {
    font-size: 11.5px;
    color: var(--ink-soft);
  }

  .empty, .loading {
    padding: 46px 0;
    color: var(--ink-soft);
    font-size: 14px;
    text-align: center;
  }
  .empty strong { display: block; color: var(--ink); font-family: 'Fraunces', serif; font-size: 18px; margin-bottom: 6px; font-weight: 500; }

  /* ---------- Forms ---------- */
  .add-layout {
    display: grid;
    grid-template-columns: 1.3fr 0.9fr;
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 720px) {
    .add-layout { grid-template-columns: 1fr; }
  }

  .glass-panel {
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--glass-shadow);
    padding: 26px;
  }

  .field { margin-bottom: 16px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  label {
    font-size: 12.5px;
    color: var(--ink-soft);
    font-weight: 500;
    display: block;
    margin-bottom: 6px;
  }
  label .optional {
    font-weight: 400;
    font-style: italic;
    opacity: 0.75;
  }
  input, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid rgba(124, 58, 237, 0.18);
    border-radius: var(--radius-sm);
    font-size: 14px;
    background: rgba(255,255,255,0.7);
    color: var(--ink);
    font-family: inherit;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input:focus, textarea:focus {
    border-color: var(--violet);
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
  }
  textarea { resize: vertical; min-height: 60px; }

  button.primary {
    background: linear-gradient(120deg, var(--pink), var(--violet));
    color: #fff;
    border: none;
    padding: 12px 26px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    margin-top: 6px;
    box-shadow: 0 8px 20px rgba(124, 58, 237, 0.32);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button.primary:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(124, 58, 237, 0.4); }
  button.primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  button.ghost-danger {
    background: rgba(255,255,255,0.6);
    color: var(--pink);
    border: 1.5px solid var(--pink);
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.15s ease;
  }
  button.ghost-danger:hover { background: var(--pink); color: #fff; }

  .msg { margin-top: 12px; font-size: 13.5px; font-weight: 500; }
  .msg.error { color: var(--pink); }
  .msg.success { color: var(--cyan); }

  /* preview card on add tab */
  .preview-label { font-size: 12.5px; color: var(--ink-soft); font-weight: 500; margin-bottom: 10px; }
  .preview-card {
    position: sticky;
    top: 24px;
  }
  .preview-frame {
    aspect-ratio: 3 / 4;
    background: rgba(255,255,255,0.5);
    border-radius: var(--radius-md);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
    border: 1px dashed rgba(124, 58, 237, 0.3);
  }
  .preview-frame img { width: 100%; height: 100%; object-fit: cover; }
  .preview-frame .no-image { font-size: 12px; color: var(--ink-soft); font-style: italic; font-family: 'Fraunces', serif; }
  .preview-name { font-family: 'Fraunces', serif; font-size: 18px; margin-bottom: 8px; }
  .preview-meta-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .preview-price {
    display: inline-block;
    color: #fff;
    font-size: 13.5px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 999px;
    background: linear-gradient(120deg, var(--pink), var(--orange));
  }
  .preview-tag {
    display: inline-block;
    color: #fff;
    font-size: 12.5px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 999px;
    background: linear-gradient(120deg, var(--blue), var(--cyan));
  }

  /* ---------- Search / detail ---------- */
  .search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
    max-width: 420px;
  }
  .search-row input { background: rgba(255,255,255,0.7); }
  .search-row button {
    background: linear-gradient(120deg, var(--blue), var(--cyan));
    color: #fff;
    border: none;
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 6px 16px rgba(61, 107, 255, 0.3);
    white-space: nowrap;
  }
  .search-hint {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 22px;
  }

  .result-count { font-size: 13px; color: var(--ink-soft); margin-bottom: 12px; font-weight: 500; }
  .result-list { display: flex; flex-direction: column; gap: 10px; }
  .result-row {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    background: var(--glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--glass-border);
    cursor: pointer;
    text-align: left;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .result-row:hover { transform: translateX(4px); box-shadow: 0 8px 20px rgba(60, 40, 120, 0.14); }
  .result-thumb {
    width: 44px;
    height: 56px;
    border-radius: 8px;
    overflow: hidden;
    flex-shrink: 0;
    background: rgba(255,255,255,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .result-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .result-thumb .no-image { font-size: 16px; color: var(--ink-soft); }
  .result-info { flex: 1; min-width: 0; }
  .result-name { font-family: 'Fraunces', serif; font-size: 14.5px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result-meta { font-size: 12px; color: var(--ink-soft); }
  .result-price { font-weight: 600; font-size: 13.5px; color: var(--pink); white-space: nowrap; }

  .back-link {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 0 0 16px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .back-link:hover { color: var(--violet); }

  .detail {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 30px;
  }
  @media (max-width: 640px) {
    .detail { grid-template-columns: 1fr; }
  }
  .detail-frame {
    aspect-ratio: 3 / 4;
    background: rgba(255,255,255,0.5);
    border-radius: var(--radius-md);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--glass-shadow);
  }
  .detail-frame img { width: 100%; height: 100%; object-fit: cover; }
  .detail-frame .no-image { font-size: 13px; color: var(--ink-soft); font-style: italic; font-family: 'Fraunces', serif; }

  .detail h3 { font-size: 23px; margin-bottom: 4px; }
  .detail .id-tag { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 14px; }

  .detail-tag-chip {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    padding: 4px 12px;
    border-radius: 999px;
    background: linear-gradient(120deg, var(--blue), var(--cyan));
    margin-bottom: 18px;
  }

  .stat-row { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .stat-chip {
    flex: 1;
    min-width: 100px;
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    color: #fff;
  }
  .stat-chip.price { background: linear-gradient(120deg, var(--pink), #ff6fa5); }
  .stat-chip.cost { background: linear-gradient(120deg, var(--violet), #9d6bff); }
  .stat-chip.stock { background: linear-gradient(120deg, var(--cyan), #4fd8e3); }
  .stat-chip b { display: block; font-family: 'Fraunces', serif; font-size: 18px; font-weight: 500; }
  .stat-chip span { font-size: 12px; opacity: 0.9; }

  .swatch-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .swatch {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--ink-soft);
    background: rgba(255,255,255,0.5);
    padding: 5px 10px;
    border-radius: 999px;
  }
  .swatch .dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.1);
    display: inline-block;
  }
  .size-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .size-chip {
    border: 1.5px solid var(--violet);
    color: var(--violet);
    border-radius: var(--radius-sm);
    padding: 4px 12px;
    font-size: 12.5px;
    font-weight: 600;
  }

  .detail-section { margin-top: 18px; }
  .detail-section label { margin-bottom: 6px; }
  .detail-section .notes-text { font-size: 14px; color: var(--ink); line-height: 1.55; }

  .hidden { display: none; }
</style>
</head>
<body>

<div class="bg-blobs">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
</div>

<header>
  <div class="brand">
    <h1>Leen Store</h1>
    <span class="tagline">inventory &amp; stock room</span>
  </div>
</header>

<nav>
  <button id="tabListBtn" class="active" onclick="showTab('list')">Collection</button>
  <button id="tabAddBtn" onclick="showTab('add')">Add a Piece</button>
  <button id="tabSearchBtn" onclick="showTab('search')">Search</button>
</nav>

<main>

  <!-- LIST TAB -->
  <section id="tab-list" class="panel">
    <div class="panel-head">
      <h2>The Collection</h2>
      <span class="count" id="itemCount"></span>
    </div>

    <div class="collection-controls">
      <div class="filter-search-row">
        <input id="collectionSearch" type="text" placeholder="Filter by name, tag, or ID…" oninput="applyFilters()">
      </div>
      <div id="tagFilters" class="tag-filters hidden"></div>
    </div>

    <div id="gallery" class="gallery">
      <div class="loading">Loading the rack…</div>
    </div>
  </section>

  <!-- ADD TAB -->
  <section id="tab-add" class="panel hidden">
    <div class="panel-head">
      <h2>Add a Piece</h2>
    </div>
    <div class="add-layout">
      <div class="glass-panel">
        <div class="field">
          <label>Name *</label>
          <input id="addName" type="text" placeholder="e.g. Floral Summer Dress" oninput="updatePreview()">
        </div>
        <div class="field">
          <label>Tag <span class="optional">(optional)</span></label>
          <input id="addTag" type="text" placeholder="e.g. Summer 2026, Bestseller…" oninput="updatePreview()">
        </div>
        <div class="field">
          <label>Image</label>
          <input id="addImageFile" type="file" accept="image/*" onchange="handleImageSelect(event)">
        </div>
        <div class="field field-row">
          <div>
            <label>Cost *</label>
            <input id="addCost" type="number" step="0.01" placeholder="0.00">
          </div>
          <div>
            <label>Price *</label>
            <input id="addPrice" type="number" step="0.01" placeholder="0.00" oninput="updatePreview()">
          </div>
        </div>
        <div class="field">
          <label>Quantity</label>
          <input id="addQty" type="number" placeholder="0">
        </div>
        <div class="field">
          <label>Colors (comma separated)</label>
          <input id="addColors" type="text" placeholder="Red, Black, White">
        </div>
        <div class="field">
          <label>Sizes (comma separated)</label>
          <input id="addSizes" type="text" placeholder="S, M, L, XL">
        </div>
        <div class="field">
          <label>Notes</label>
          <textarea id="addNotes" placeholder="Any extra details…"></textarea>
        </div>
        <button class="primary" id="saveBtn" onclick="addItem()">Save Piece</button>
        <div id="addMsg" class="msg"></div>
      </div>

      <div class="preview-card">
        <div class="preview-label">Preview</div>
        <div class="glass-panel">
          <div class="preview-frame" id="previewFrame">
            <span class="no-image">no image yet</span>
          </div>
          <div class="preview-name" id="previewName">Untitled piece</div>
          <div class="preview-meta-row">
            <span class="preview-price" id="previewPrice">$0.00</span>
            <span class="preview-tag hidden" id="previewTag"></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- SEARCH TAB -->
  <section id="tab-search" class="panel hidden">
    <div class="panel-head">
      <h2>Search</h2>
    </div>
    <div class="search-row">
      <input id="searchQuery" type="text" placeholder="Search by name, tag, or ID…" onkeydown="if(event.key==='Enter') runSearch()">
      <button onclick="runSearch()">Search</button>
    </div>
    <div class="search-hint">Matches any part of a name or tag, case-insensitive — or an exact ID.</div>
    <div id="searchResult"></div>
  </section>

</main>

<script>
  // ======= CONFIG: put your Supabase project info here =======
  const SUPABASE_URL = "https://fantkmdbnhtlwiyfjicl.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_D12sGfWmd2ztsE6HU5csIQ_PP4_sJ-H";
  const IMAGE_BUCKET = "ITEMS"; // must exist in Supabase Storage
  // =============================================================

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const COLOR_MAP = {
    red: '#b23b3b', black: '#222', white: '#fff', blue: '#3a5da8', navy: '#1f2d4d',
    green: '#3f7250', pink: '#e2a0b3', purple: '#7d4f9c', yellow: '#e0c243',
    beige: '#e6d8c3', ivory: '#f5efe3', cream: '#f2e9d8', gray: '#9b9b9b', grey: '#9b9b9b',
    brown: '#6b4a35', orange: '#d97b3f', teal: '#3f8f8a', maroon: '#6a2436',
    gold: '#c7a15a', silver: '#c7c7c7', lavender: '#c9b8db', burgundy: '#6e2536'
  };

  // currently selected file for the Add form + its local preview URL
  let selectedImageFile = null;
  let selectedImagePreviewUrl = null;

  // Collection state
  let allItems = [];
  let activeTagFilter = null;

  // Search tab cache (avoid refetching when opening a result from a list)
  let currentSearchResults = [];

  function showTab(tab) {
    document.getElementById('tab-list').classList.add('hidden');
    document.getElementById('tab-add').classList.add('hidden');
    document.getElementById('tab-search').classList.add('hidden');
    document.getElementById('tabListBtn').classList.remove('active');
    document.getElementById('tabAddBtn').classList.remove('active');
    document.getElementById('tabSearchBtn').classList.remove('active');

    document.getElementById('tab-' + tab).classList.remove('hidden');
    document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1) + 'Btn').classList.add('active');

    if (tab === 'list') loadItems();
  }

  // ---------- LIST (gallery grid, with images, tag filters + quick search) ----------
  async function loadItems() {
    const gallery = document.getElementById('gallery');
    const count = document.getElementById('itemCount');
    gallery.innerHTML = '<div class="loading">Loading the rack…</div>';
    count.textContent = '';

    const { data, error } = await supabaseClient
      .from('items')
      .select('*')
      .order('id', { ascending: true });

    if (error) {
      gallery.innerHTML = `<div class="empty"><strong>Couldn't load the collection</strong>${escapeHtml(error.message)}</div>`;
      document.getElementById('tagFilters').classList.add('hidden');
      return;
    }

    allItems = data;
    renderTagFilters();
    applyFilters();
  }

  function renderTagFilters() {
    const wrap = document.getElementById('tagFilters');
    const tags = [...new Set(allItems.map(i => i.tag).filter(Boolean))].sort((a, b) => a.localeCompare(b));

    if (!tags.length) {
      wrap.classList.add('hidden');
      wrap.innerHTML = '';
      return;
    }

    wrap.classList.remove('hidden');
    wrap.innerHTML = tags.map(t => `
      <button class="tag-pill ${activeTagFilter === t ? 'active' : ''}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</button>
    `).join('') + (activeTagFilter ? `<button class="clear-filters" id="clearTagFilter">Clear tag</button>` : '');
  }

  // event delegation for tag pills (safe against special characters in tag names)
  document.addEventListener('click', (e) => {
    const pill = e.target.closest('#tagFilters .tag-pill');
    if (pill) {
      const tag = pill.dataset.tag;
      activeTagFilter = (activeTagFilter === tag) ? null : tag;
      renderTagFilters();
      applyFilters();
      return;
    }
    if (e.target.id === 'clearTagFilter') {
      activeTagFilter = null;
      renderTagFilters();
      applyFilters();
    }
  });

  function applyFilters() {
    const q = document.getElementById('collectionSearch').value.trim().toLowerCase();
    let filtered = allItems;

    if (activeTagFilter) {
      filtered = filtered.filter(i => i.tag === activeTagFilter);
    }

    if (q) {
      filtered = filtered.filter(i =>
        i.name.toLowerCase().includes(q) ||
        (i.tag && i.tag.toLowerCase().includes(q)) ||
        String(i.id) === q
      );
    }

    renderGallery(filtered);
  }

  function renderGallery(items) {
    const gallery = document.getElementById('gallery');
    const count = document.getElementById('itemCount');

    if (!allItems.length) {
      gallery.innerHTML = '<div class="empty"><strong>The rack is empty</strong>Add your first piece to get started.</div>';
      count.textContent = '';
      return;
    }

    if (!items.length) {
      gallery.innerHTML = '<div class="empty"><strong>No matches</strong>Try a different name, tag, or ID.</div>';
      count.textContent = '0 pieces';
      return;
    }

    count.textContent = items.length + (items.length === 1 ? ' piece' : ' pieces') +
      (items.length !== allItems.length ? ` of ${allItems.length}` : '');

    gallery.innerHTML = items.map(item => `
      <button class="piece" onclick="openFromCollection(${item.id})">
        <div class="piece-frame">
          ${item.image_url
            ? `<img src="${item.image_url}" alt="${escapeHtml(item.name)}" loading="lazy">`
            : `<span class="no-image">no image</span>`}
          <span class="qty-badge">Qty ${item.quantity ?? 0}</span>
          <span class="price-badge">$${Number(item.price).toFixed(2)}</span>
          ${item.tag ? `<span class="tag-badge">${escapeHtml(item.tag)}</span>` : ''}
        </div>
        <div class="piece-name">${escapeHtml(item.name)}</div>
        <div class="piece-id">ID ${item.id}</div>
      </button>
    `).join('');
  }

  function openFromCollection(id) {
    const item = allItems.find(i => i.id === id);
    showTab('search');
    document.getElementById('searchQuery').value = id;
    if (item) {
      currentSearchResults = [item];
      document.getElementById('searchResult').innerHTML = renderDetail(item);
    } else {
      runSearch();
    }
  }

  // ---------- ADD ----------
  function handleImageSelect(event) {
    const file = event.target.files && event.target.files[0] ? event.target.files[0] : null;

    // release the old preview URL before creating a new one (avoid memory leaks)
    if (selectedImagePreviewUrl) {
      URL.revokeObjectURL(selectedImagePreviewUrl);
      selectedImagePreviewUrl = null;
    }

    selectedImageFile = file;
    if (file) {
      selectedImagePreviewUrl = URL.createObjectURL(file);
    }
    updatePreview();
  }

  function updatePreview() {
    const name = document.getElementById('addName').value.trim();
    const price = parseFloat(document.getElementById('addPrice').value) || 0;
    const tag = document.getElementById('addTag').value.trim();

    document.getElementById('previewName').textContent = name || 'Untitled piece';
    document.getElementById('previewPrice').textContent = '$' + price.toFixed(2);

    const tagEl = document.getElementById('previewTag');
    if (tag) {
      tagEl.textContent = tag;
      tagEl.classList.remove('hidden');
    } else {
      tagEl.classList.add('hidden');
    }

    const frame = document.getElementById('previewFrame');
    frame.innerHTML = selectedImagePreviewUrl
      ? `<img src="${selectedImagePreviewUrl}" alt="preview">`
      : `<span class="no-image">no image yet</span>`;
  }

  // uploads the picked file to Supabase Storage, returns a signed URL valid for ~1 month
  async function uploadImageAndGetSignedUrl(file) {
    const safeExt = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
    const filePath = `${Date.now()}-${Math.random().toString(36).slice(2)}.${safeExt}`;

    const { error: uploadError } = await supabaseClient
      .storage
      .from(IMAGE_BUCKET)
      .upload(filePath, file, {
        cacheControl: '3600',
        upsert: false,
        contentType: file.type || 'image/jpeg'
      });

    if (uploadError) {
      throw new Error('Image upload failed: ' + uploadError.message);
    }

    const ONE_MONTH_SECONDS = 60 * 60 * 24 * 30;
    const { data: signedData, error: signError } = await supabaseClient
      .storage
      .from(IMAGE_BUCKET)
      .createSignedUrl(filePath, ONE_MONTH_SECONDS);

    if (signError || !signedData) {
      throw new Error('Could not create signed URL: ' + (signError ? signError.message : 'unknown error'));
    }

    return signedData.signedUrl;
  }

  async function addItem() {
    const msg = document.getElementById('addMsg');
    msg.textContent = '';
    msg.className = 'msg';

    const name = document.getElementById('addName').value.trim();
    const tag = document.getElementById('addTag').value.trim() || null;
    const cost = parseFloat(document.getElementById('addCost').value) || 0;
    const price = parseFloat(document.getElementById('addPrice').value) || 0;
    const qty = parseInt(document.getElementById('addQty').value) || 0;
    const colors = splitCsv(document.getElementById('addColors').value);
    const sizes = splitCsv(document.getElementById('addSizes').value);
    const notes = document.getElementById('addNotes').value.trim();

    if (!name) {
      msg.textContent = 'A name is required.';
      msg.classList.add('error');
      return;
    }

    const saveBtn = document.getElementById('saveBtn');
    const originalBtnText = saveBtn.textContent;
    saveBtn.disabled = true;

    let image_url = '';

    try {
      if (selectedImageFile) {
        saveBtn.textContent = 'Uploading image…';
        image_url = await uploadImageAndGetSignedUrl(selectedImageFile);
      }

      saveBtn.textContent = 'Saving…';

      const { data, error } = await supabaseClient
        .from('items')
        .insert([{ name, tag, cost, price, quantity: qty, colors, sizes, image_url, notes }])
        .select();

      if (error) {
        msg.textContent = 'Error: ' + error.message;
        msg.classList.add('error');
        return;
      }

      msg.textContent = `Saved — item ID ${data[0].id}.`;
      msg.classList.add('success');
      clearAddForm();
    } catch (err) {
      msg.textContent = err.message || 'Something went wrong.';
      msg.classList.add('error');
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = originalBtnText;
    }
  }

  function clearAddForm() {
    ['addName','addTag','addCost','addPrice','addQty','addColors','addSizes','addNotes']
      .forEach(id => document.getElementById(id).value = '');

    document.getElementById('addImageFile').value = '';
    if (selectedImagePreviewUrl) {
      URL.revokeObjectURL(selectedImagePreviewUrl);
    }
    selectedImageFile = null;
    selectedImagePreviewUrl = null;

    updatePreview();
  }

  function splitCsv(str) {
    return str.split(',').map(s => s.trim()).filter(Boolean);
  }

  // ---------- SEARCH (by name, tag, or ID — case-insensitive) ----------
  async function runSearch() {
    const raw = document.getElementById('searchQuery').value.trim();
    const resultDiv = document.getElementById('searchResult');

    if (!raw) {
      resultDiv.innerHTML = '<div class="msg error">Type a name, tag, or ID to search.</div>';
      return;
    }

    resultDiv.innerHTML = '<div class="loading">Searching…</div>';

    // PostgREST's .or() uses commas/parens as syntax — strip them from free text to keep the filter valid
    const cleaned = raw.replace(/[,()]/g, ' ').trim();
    const isNumeric = /^\d+$/.test(raw);

    let filter = `name.ilike.%${cleaned}%,tag.ilike.%${cleaned}%`;
    if (isNumeric) filter += `,id.eq.${raw}`;

    const { data, error } = await supabaseClient
      .from('items')
      .select('*')
      .or(filter)
      .order('id', { ascending: true });

    if (error) {
      resultDiv.innerHTML = `<div class="msg error">Error: ${escapeHtml(error.message)}</div>`;
      return;
    }

    if (!data.length) {
      resultDiv.innerHTML = '<div class="empty"><strong>Nothing found</strong>No piece matches that name, tag, or ID.</div>';
      return;
    }

    currentSearchResults = data;

    if (data.length === 1) {
      resultDiv.innerHTML = renderDetail(data[0]);
      return;
    }

    resultDiv.innerHTML = `
      <div class="result-count">${data.length} matches</div>
      <div class="result-list">
        ${data.map(item => `
          <button class="result-row" data-id="${item.id}">
            <div class="result-thumb">
              ${item.image_url ? `<img src="${item.image_url}" alt="">` : `<span class="no-image">—</span>`}
            </div>
            <div class="result-info">
              <div class="result-name">${escapeHtml(item.name)}</div>
              <div class="result-meta">ID ${item.id}${item.tag ? ' · ' + escapeHtml(item.tag) : ''} · Qty ${item.quantity ?? 0}</div>
            </div>
            <div class="result-price">$${Number(item.price).toFixed(2)}</div>
          </button>
        `).join('')}
      </div>
    `;
  }

  // open a detail view from the result list without refetching
  document.addEventListener('click', (e) => {
    const row = e.target.closest('.result-row');
    if (!row) return;
    const id = parseInt(row.dataset.id, 10);
    const item = currentSearchResults.find(i => i.id === id);
    if (item) {
      document.getElementById('searchResult').innerHTML = renderBackLink() + renderDetail(item);
    }
  });

  function renderBackLink() {
    if (currentSearchResults.length <= 1) return '';
    return `<button class="back-link" onclick="reRenderResultsList()">&larr; Back to results</button>`;
  }

  function reRenderResultsList() {
    const resultDiv = document.getElementById('searchResult');
    resultDiv.innerHTML = `
      <div class="result-count">${currentSearchResults.length} matches</div>
      <div class="result-list">
        ${currentSearchResults.map(item => `
          <button class="result-row" data-id="${item.id}">
            <div class="result-thumb">
              ${item.image_url ? `<img src="${item.image_url}" alt="">` : `<span class="no-image">—</span>`}
            </div>
            <div class="result-info">
              <div class="result-name">${escapeHtml(item.name)}</div>
              <div class="result-meta">ID ${item.id}${item.tag ? ' · ' + escapeHtml(item.tag) : ''} · Qty ${item.quantity ?? 0}</div>
            </div>
            <div class="result-price">$${Number(item.price).toFixed(2)}</div>
          </button>
        `).join('')}
      </div>
    `;
  }

  function renderDetail(data) {
    const colors = data.colors || [];
    const sizes = data.sizes || [];

    return `
      <div class="detail glass-panel">
        <div class="detail-frame">
          ${data.image_url
            ? `<img src="${data.image_url}" alt="${escapeHtml(data.name)}">`
            : `<span class="no-image">no image</span>`}
        </div>
        <div>
          <h3>${escapeHtml(data.name)}</h3>
          <div class="id-tag">ID ${data.id} · added ${new Date(data.created_at).toLocaleDateString()}</div>
          ${data.tag ? `<span class="detail-tag-chip">${escapeHtml(data.tag)}</span>` : ''}

          <div class="stat-row">
            <div class="stat-chip price"><b>$${Number(data.price).toFixed(2)}</b><span>price</span></div>
            <div class="stat-chip cost"><b>$${Number(data.cost).toFixed(2)}</b><span>cost</span></div>
            <div class="stat-chip stock"><b>${data.quantity ?? 0}</b><span>in stock</span></div>
          </div>

          <div class="detail-section">
            <label>Colors</label>
            <div class="swatch-row">
              ${colors.length ? colors.map(c => `
                <span class="swatch">
                  <span class="dot" style="background:${COLOR_MAP[c.toLowerCase()] || '#eee'}"></span>
                  ${escapeHtml(c)}
                </span>
              `).join('') : '<span class="swatch">none listed</span>'}
            </div>
          </div>

          <div class="detail-section">
            <label>Sizes</label>
            <div class="size-row">
              ${sizes.length ? sizes.map(s => `<span class="size-chip">${escapeHtml(s)}</span>`).join('') : '<span class="swatch">none listed</span>'}
            </div>
          </div>

          ${data.notes ? `
            <div class="detail-section">
              <label>Notes</label>
              <div class="notes-text">${escapeHtml(data.notes)}</div>
            </div>
          ` : ''}

          <div class="detail-section">
            <button class="ghost-danger" onclick="deleteItem(${data.id})">Delete this piece</button>
          </div>
        </div>
      </div>
    `;
  }

  async function deleteItem(id) {
    if (!confirm('Delete this piece? This cannot be undone.')) return;
    const { error } = await supabaseClient.from('items').delete().eq('id', id);
    if (error) {
      alert('Error deleting: ' + error.message);
      return;
    }
    currentSearchResults = currentSearchResults.filter(i => i.id !== id);
    document.getElementById('searchResult').innerHTML = '<div class="msg success">Piece deleted.</div>';
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[m]));
  }

  // initial load
  loadItems();
</script>
</body>
</html>
